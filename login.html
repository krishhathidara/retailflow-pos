<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SwiftPOS</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>

    <div class="auth-container">
        <div class="auth-form-side fade-in-up">
            <div class="auth-header">
                <a href="index.html" class="back-link"><span class="material-icons-round">arrow_back</span> Back</a>
                <div class="logo">
                    <div class="logo-icon"><span class="material-icons-round">shopping_cart</span></div>
                    <span>SwiftPOS</span>
                </div>
            </div>

            <div class="form-wrapper">
                <h2 id="pageTitle">Welcome back</h2>
                <p id="pageSubtitle">Sign in to access your dashboard</p>

                <form id="authForm">
                    <div class="input-group">
                        <label>Email</label>
                        <div class="input-wrapper">
                            <span class="material-icons-round">email</span>
                            <input type="email" placeholder="you@example.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <span class="material-icons-round">lock</span>
                            <input type="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Sign In</button>
                </form>

                <p class="switch-text">
                    Don't have an account? <a href="#" id="toggleAuth">Sign up</a>
                </p>
            </div>
        </div>

        <div class="auth-decor-side">
            <div class="decor-content fade-in-up delay-200">
                <div class="floating-icon"><span class="material-icons-round">shopping_cart</span></div>
                <h2>Manage Your Business</h2>
                <p>Complete POS solution with sales tracking, inventory management, and detailed reporting.</p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
